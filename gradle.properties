org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=2g
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = true

# Toolchain
# 25 is the LTS that has the final Java FFM API (java.lang.foreign, final since JDK 22), which the
# libghostty-vt binding uses to call the native library.
jvm.toolchain = 25
