[versions]
composeMaterial3 = "1.12.0-alpha03" # https://github.com/JetBrains/compose-multiplatform/releases
composeMultiplatform = "1.12.1"     # https://github.com/JetBrains/compose-multiplatform/releases
coroutines = "1.11.0"               # https://github.com/Kotlin/kotlinx.coroutines/releases
kotlin = "2.4.21"                   # https://kotlinlang.org/docs/releases.html#release-history

[plugins]
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }

kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
