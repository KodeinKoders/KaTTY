[versions]
composeMaterial3 = "1.12.0-alpha03" # https://github.com/JetBrains/compose-multiplatform/releases
composeMultiplatform = "1.12.1"     # https://github.com/JetBrains/compose-multiplatform/releases
coroutines = "1.11.0"               # https://github.com/Kotlin/kotlinx.coroutines/releases
kotlin = "2.4.21"                   # https://kotlinlang.org/docs/releases.html#release-history
pty4j = "0.14.0"                    # https://github.com/JetBrains/pty4j/releases
slf4j = "2.0.19"                    # https://www.slf4j.org/news.html

[plugins]
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }

kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }

pty4j = { module = "org.jetbrains.pty4j:pty4j", version.ref = "pty4j" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
