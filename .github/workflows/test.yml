name: check

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**/.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**/.gitignore'
  workflow_dispatch:

jobs:

  check:
    runs-on: macOS-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up JDK Temurin 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew --stacktrace --scan build
        shell: bash
      # The log only names the tests that fail: their messages, and the screens that the tests print, are in the reports.
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  # Windows, on both processors that KaTTY is built for: each machine builds libghostty-vt and the installer for its own processor, since jpackage
  # only packages for the system that runs it, and the tests run there. The installer is kept as an artifact of the run.
  windows:
    strategy:
      fail-fast: false
      matrix:
        runner: [ windows-latest, windows-11-arm ]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true
          # The whole history: the patch number of the version counts the commits, and an installer only replaces one of a lower version.
          fetch-depth: 0
      # The JDK that runs Gradle: Temurin has none for Windows on ARM64, Zulu has (the build itself runs on the JetBrains Runtime of its toolchain).
      - name: Set up JDK Zulu 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      # Windows PowerShell builds its caches the first time it starts on a machine (its modules' commands), which on the ARM64 one took longer
      # than the tests that run it wait: started once here, and timed, then again.
      - name: Start Windows PowerShell once
        run: |
          foreach ($run in 'first', 'second') {
            $time = Measure-Command { powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'Import-Module PSReadLine; Get-Command | Out-Null' }
            "Windows PowerShell, $run start: $([math]::Round($time.TotalSeconds, 1)) s"
          }
        shell: pwsh
      - name: Build
        run: ./gradlew --stacktrace --scan build :app:packageMsi
        shell: bash
      # Kept even when a test failed, as long as it was made: it can be tried by hand.
      - name: Keep the installer
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: KaTTY-${{ matrix.runner }}
          path: app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn
      # With the logs that the JVM writes when it crashes (`hs_err_pid*.log`, in the folder of the module whose tests it ran), which say where.
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.runner }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/hs_err_pid*.log
          retention-days: 7
